name: Build Shattered Realms

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-shattered-realms.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Shattered Realms project
        uses: actions/checkout@v4

      - name: Check out pinned pokeemerald-expansion engine
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: bb1093a7c72d3961d9a37d8e02ad2abc2c866682
          path: engine
          persist-credentials: false

      - name: Test our game modifications
        run: python3 -m unittest discover -s tests -v

      - name: Install GBA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev python3

      - name: Apply gameplay and configuration overrides
        run: python3 scripts/apply_overrides.py --engine engine

      - name: Build Shattered Realms GBA ROM
        run: make -C engine -j2 -Otarget TITLE=SHATTERED GAME_CODE=BSRE FILE_NAME=shattered-realms

      - name: Verify and package
        run: |
          python3 scripts/verify_rom.py engine/shattered-realms.gba
          mkdir -p dist
          cp engine/shattered-realms.gba dist/ShatteredRealms-Alpha0.1.gba
          sha256sum dist/ShatteredRealms-Alpha0.1.gba > dist/SHA256SUMS.txt

      - name: Upload iPhone / Delta build
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredRealms-Alpha0.1-GBA
          path: dist/
          if-no-files-found: error
          retention-days: 7
